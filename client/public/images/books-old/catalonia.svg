<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 750" width="500" height="750">
  <defs>
    <linearGradient id="bg-catalonia" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#581c87"/>
      <stop offset="50%" stop-color="#7e22ce"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <radialGradient id="glow-catalonia" cx="50%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#e9d5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#581c87" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-catalonia" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="500" height="750" fill="url(#bg-catalonia)"/>
  <rect width="500" height="750" fill="url(#glow-catalonia)"/>

  <!-- Ornate Archival Borders -->
  <rect x="24" y="24" width="452" height="702" rx="16" fill="none" stroke="#e9d5ff" stroke-width="2.5" stroke-opacity="0.6"/>
  <rect x="34" y="34" width="432" height="682" rx="12" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.15"/>
  <circle cx="24" cy="24" r="5" fill="#e9d5ff" fill-opacity="0.8"/>
  <circle cx="476" cy="24" r="5" fill="#e9d5ff" fill-opacity="0.8"/>
  <circle cx="24" cy="726" r="5" fill="#e9d5ff" fill-opacity="0.8"/>
  <circle cx="476" cy="726" r="5" fill="#e9d5ff" fill-opacity="0.8"/>

  <!-- Header Header Ribbon -->
  <text x="250" y="85" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#e9d5ff" text-anchor="middle" letter-spacing="4">
    BOOKBRIDGE WORLD ARCHIVE
  </text>
  <text x="250" y="112" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" text-anchor="middle">
    ENGLISH • NON-FICTION
  </text>
  <line x1="160" y1="130" x2="340" y2="130" stroke="#e9d5ff" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Center Artwork Motif -->
  <circle cx="250" cy="270" r="80" fill="#000000" fill-opacity="0.3" stroke="#e9d5ff" stroke-width="2" stroke-dasharray="6 4" filter="url(#shadow-catalonia)"/>
  <text x="250" y="295" font-size="64" text-anchor="middle" filter="url(#shadow-catalonia)">
    🚩
  </text>

  <!-- Title & Author Block -->
  <g transform="translate(250, 430)">
    <rect x="-190" y="-15" width="380" height="110" rx="12" fill="#000000" fill-opacity="0.35" stroke="#ffffff" stroke-width="1" stroke-opacity="0.1"/>
    <text x="0" y="38" font-family="'Playfair Display', Georgia, serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle" filter="url(#shadow-catalonia)">
      Homage to Catalonia
    </text>
    <text x="0" y="74" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="15" font-weight="600" fill="#e9d5ff" text-anchor="middle">
      By George Orwell
    </text>
  </g>

  <!-- Quote & Subtext -->
  <text x="250" y="585" font-family="'Playfair Display', Georgia, serif" font-size="12" font-style="italic" fill="#e2e8f0" fill-opacity="0.8" text-anchor="middle">
    "BARCELONA CIVIL WAR MEMOIR"
  </text>

  <!-- Footer Seal & Meta -->
  <line x1="60" y1="640" x2="440" y2="640" stroke="#ffffff" stroke-width="1" stroke-opacity="0.2"/>
  <text x="70" y="675" font-family="monospace" font-size="12" fill="#94a3b8">
    EDITION: 1938
  </text>
  <text x="430" y="675" font-family="monospace" font-size="12" fill="#e9d5ff" text-anchor="end" font-weight="bold">
    AUTHENTIC CLASSIC
  </text>
</svg>